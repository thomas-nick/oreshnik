name: Build and deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_DOMAIN: ${{ secrets.HOSTINGER_DOMAIN }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Smoke check build output
        run: |
          test -f dist/index.html
          test -f dist/sitemap-index.xml
          ls -lh dist | head -20

      - name: Package dist
        id: package
        run: |
          ts=$(date -u +%Y%m%d_%H%M%S)
          archive="oreshnik_${ts}.zip"
          (cd dist && zip -qr "../${archive}" .)
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Validate deploy secrets
        run: |
          if [ -z "$HOSTINGER_API_TOKEN" ] || [ -z "$HOSTINGER_DOMAIN" ]; then
            echo "::error title=Missing secrets::Set HOSTINGER_API_TOKEN and HOSTINGER_DOMAIN in repo secrets."
            exit 1
          fi
          echo "Deploying to domain: $HOSTINGER_DOMAIN"

      - name: Deploy to Hostinger
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: node scripts/deploy-hostinger.mjs

      - name: Upload build artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oreshnik-dist
          path: dist
          retention-days: 7
